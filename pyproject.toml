[project]
name = "screener"
version = "2.0.0"
description = "Evidence-based, platform-informed application readiness assessment (Phase 2 MVP)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "pymupdf>=1.24", "python-docx>=1.1", "jsonschema>=4.20"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
pythonpath = ["packages", "."]
addopts = "-q"
